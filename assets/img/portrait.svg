<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" role="img" aria-labelledby="portraitTitle portraitDesc">
  <title id="portraitTitle">王鹏飞的头像插画</title>
  <desc id="portraitDesc">一张大胆配色的编辑风头像插画：深色剪影、荧光绿眼镜、蓝色圆形背景。</desc>

