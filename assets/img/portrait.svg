  <circle cx="520" cy="104" r="206" fill="#2F4BFF"/>
  <circle cx="520" cy="104" r="206" fill="none" stroke="#0E0E0C" stroke-width="2" opacity=".22"/>

  <defs>
    <pattern id="portraitDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#0E0E0C"/>
